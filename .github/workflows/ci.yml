name: Enyd Arch CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/enyd-arch-completion
      - security-privacy-hardening

permissions:
  contents: read

concurrency:
  group: enyd-arch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        env:
          AUTH_SECRET: ci-only-secret-value-with-more-than-thirty-two-characters
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/enyd_arch_ci
          APP_ORIGIN: http://localhost:3000
          ARCH_GAME_ORIGIN: http://localhost:3101

      - name: Build production application
        run: pnpm build
        env:
          AUTH_SECRET: ci-only-secret-value-with-more-than-thirty-two-characters
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/enyd_arch_ci
          APP_ORIGIN: http://localhost:3000
          ARCH_GAME_ORIGIN: http://localhost:3101
          STORAGE_DRIVER: local
          STORAGE_ROOT: ./storage
