name: Enyd Arch CI

on:
  pull_request:
  push:
    branches:
      - main
      - work/enyd-arch-completion-2026
      - work/enyd-arch-route-coverage
      - work/enyd-arch-security-center
      - work/enyd-arch-safety-controls

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      AUTH_SECRET: ci-only-secret-value-with-at-least-thirty-two-characters
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/enyd_arch
      APP_ORIGIN: http://localhost:3000
      ARCH_GAME_ORIGIN: http://localhost:3101
      STORAGE_DRIVER: local
      STORAGE_ROOT: ./storage
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build production application
        run: pnpm build
